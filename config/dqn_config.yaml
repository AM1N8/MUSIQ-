env:
  data_path: "data"
  mode: "discrete"
  max_session_length: 20
  num_recent_tracks: 5
  user_embed_dim: 32
  song_embed_dim: 8
  
  # Reward weights
  reward_full_listen: 1.0
  reward_partial_listen: 0.5
  reward_skip: -0.5
  reward_diversity_weight: 0.2
  reward_personalization_weight: 0.3
  reward_session_bonus_weight: 0.1
  
  # User behavior
  skip_threshold: 0.3
  partial_threshold: 0.6
  dropout_probability: 0.05

training:
  algorithm: "dqn"
  num_episodes: 10000
  eval_interval: 100
  eval_episodes: 10
  save_interval: 1000
  log_interval: 10
  
  warmup_steps: 1000
  grad_clip: 1.0
  
  checkpoint_dir: "checkpoints"
  log_dir: "logs"
  tensorboard_dir: "runs"
  
  experiment_name: null
  use_wandb: false
  wandb_project: "music-rl"
  
  device: "cuda"
  num_workers: 1
  seed: 42

dqn:
  learning_rate: 0.0001
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 50000
  target_update_freq: 1000
  batch_size: 64
  buffer_size: 100000
  use_double_dqn: true
  use_dueling: true
  
  network_config:
    hidden_dims: [256, 128, 64]
    activation: "relu"
    use_layer_norm: true
    dropout: 0.1
    use_attention: true
    attention_heads: 4